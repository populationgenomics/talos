name: Security Checks

on: [pull_request]

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    name: Pip Audit
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      # audit what the image actually installs: every extra, at the versions pinned in uv.lock.
      # svafotate-cpg is a git dependency with no PyPI version to audit; its dependencies are still exported
      - name: Export locked requirements
        run: |
          uv export --locked --all-extras --no-emit-project --no-emit-package svafotate-cpg \
            --no-hashes --output-file requirements-audit.txt

      # --disable-pip: audit the pins as exported instead of re-resolving with pip, which rejects
      # clinvarbitration's Requires-Python upper bound (<3.12) that uv deliberately ignores
      - name: pip-audit
        shell: bash
        run: |
          uvx pip-audit --disable-pip --no-deps -r requirements-audit.txt \
            --format markdown --desc off | tee -a "$GITHUB_STEP_SUMMARY"
